<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>浏览器环境 · fpconsole</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="mark" aria-hidden="true">fp</div>
      <div><div class="brand-name">fpconsole</div><div class="brand-sub">实例管理台</div></div>
    </div>
    <nav class="nav" aria-label="功能"><a class="active" href="main.html"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.2"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.2"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.2"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.2"/></svg><span>浏览器环境</span></a><a class="" href="members.html"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="3"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a3 3 0 0 1 0 5.75"/></svg><span>成员管理</span></a><a class="" href="error-proxy.html"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M4 12h16M12 4c2.2 2.4 3.3 5.1 3.3 8s-1.1 5.6-3.3 8c-2.2-2.4-3.3-5.1-3.3-8s1.1-5.6 3.3-8z"/></svg><span>代理管理</span></a><a class="" href="env-settings.html"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="8" cy="7" r="2"/><circle cx="16" cy="17" r="2"/></svg><span>环境设置</span></a><a class="" href="system.html"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/></svg><span>系统设置</span></a></nav>
    <div class="net" role="status"><i></i>网络正常</div>
  </aside>
  <div class="content">
    <div class="topbar">
      <span class="ver">v0.1.0</span>
      <button class="icon-btn" type="button" aria-label="通知，2 条未读"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9a6 6 0 1 1 12 0c0 7 2 7 2 7H4s2 0 2-7"/><path d="M10 19a2 2 0 0 0 4 0"/></svg><span class="badge-count">2</span></button>
      <span class="mock">MOCK</span>
    </div>
    <section class="card create" aria-label="快速创建环境">
      <div class="create-hd">
        <div><h1>快速创建环境</h1><p>指纹配置将随人设永久锁定</p></div>
        <button class="linkish" type="button" aria-expanded="false">更多设置 <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
      </div>
      <div class="create-row">
        <div class="field"><div class="lbl">国家 / 地区</div>
          <div class="combo"><button class="select" type="button"><span class="val"><svg class="flag" viewBox="0 0 19 13" aria-hidden="true">
<rect width="19" height="13" fill="#B22234"/>
<rect y="2" width="19" height="1" fill="#fff"/><rect y="4" width="19" height="1" fill="#fff"/>
<rect y="6" width="19" height="1" fill="#fff"/><rect y="8" width="19" height="1" fill="#fff"/>
<rect y="10" width="19" height="1" fill="#fff"/><rect width="8" height="7" fill="#3C3B6E"/>
</svg>美国</span><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button></div>
        </div>
        <div class="field"><div class="lbl">州 / 省</div>
          <button class="select" type="button"><span class="val">加利福尼亚州</span><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
        </div>
        <div class="field"><div class="lbl">多开数量</div>
          <button class="select" type="button"><span class="val">1</span><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
        </div>
        <div class="field"><label for="url">启动网址（可选）</label>
          <input class="input" id="url" placeholder="留空则不附加" value="">
        </div>
        <div class="field"><div class="lbl" aria-hidden="true">&nbsp;</div><button class="btn btn-primary" type="button" disabled><span class="spinner"></span>创建中…</button></div>
      </div>
      
    </section><section class="card list" aria-label="环境列表">
      <div class="list-hd"><div class="tabs" role="tablist">
      <button class="tab on" type="button">全部 <span class="n">–</span></button>
      <button class="tab " type="button"><i></i>运行中 <span class="n">–</span></button>
      <button class="tab " type="button"><i></i>已关闭 <span class="n">–</span></button>
      <button class="tab " type="button"><i></i>已过期 <span class="n">–</span></button>
    </div><div class="tools">
      <label class="search"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="m20 20-3.5-3.5"/></svg><input placeholder="请输入关键词" aria-label="搜索环境"></label>
      <button class="btn btn-sm" type="button">批量操作 <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
      <button class="icon-btn" type="button" aria-label="刷新" style="border:1px solid var(--border-subtle)"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.2-5.5"/><path d="M20 4v5h-5"/></svg></button>
    </div></div>
      <div class="table-wrap"><table><thead><tr><th>环境名称</th><th>状态</th><th>代理 IP</th><th>操作</th></tr></thead><tbody>
      <tr class="skel-row"><td><div class="skel" style="width:46%"></div></td><td><div class="skel" style="width:56px"></div></td><td><div class="skel" style="width:70%"></div></td><td><div class="skel" style="width:72px"></div></td></tr>
      <tr class="skel-row"><td><div class="skel" style="width:38%"></div></td><td><div class="skel" style="width:56px"></div></td><td><div class="skel" style="width:60%"></div></td><td><div class="skel" style="width:72px"></div></td></tr>
      <tr class="skel-row"><td><div class="skel" style="width:52%"></div></td><td><div class="skel" style="width:56px"></div></td><td><div class="skel" style="width:64%"></div></td><td><div class="skel" style="width:72px"></div></td></tr>
    </tbody></table></div>
    </section>
  </div>
</div>

</body>
</html>
