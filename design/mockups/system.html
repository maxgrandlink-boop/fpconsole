  <div class="content">
    <div class="topbar">
      <span class="ver">v0.1.0</span>
      <button class="icon-btn" type="button" aria-label="通知，2 条未读"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9a6 6 0 1 1 12 0c0 7 2 7 2 7H4s2 0 2-7"/><path d="M10 19a2 2 0 0 0 4 0"/></svg><span class="badge-count">2</span></button>

    <section class="page"><h1>系统设置</h1><p class="muted" style="margin-top:-8px">外观和路径都只保存在本机。</p>
<div class="field" style="max-width:360px;margin-bottom:20px">
  <div class="lbl">外观</div>
  <div class="seg" role="radiogroup" aria-label="外观">
    <button class="on" type="button" aria-pressed="true">深色</button>
    <button type="button" aria-pressed="false">浅色</button>
  </div>
  <p class="hint">点选后立即切换。默认深色。选择写在本机，下次打开仍用上次的皮肤。</p>
</div>
<div class="set-grid">
  <div class="field"><label>browser_exe</label><input class="input mono" value="D:\fpconsole-kit\browser\chrome.exe"></div>
  <div class="field"><label>kit_dir</label><input class="input mono" value="D:\fpconsole-kit"></div>
  <div class="field"><label>jump_tcp</label><input class="input mono" value="10.0.0.1:443"></div>
  <div class="field"><label>jump_token</label><input class="input mono" value="demo-token"></div>
  <div class="field"><label>jump_max_attempts</label><input class="input mono" value="450"></div>
  <div class="field"><label>jump_max_wait_ms</label><input class="input mono" value="900000"></div>
</div>
<div style="margin-top:16px;display:flex;justify-content:flex-end;gap:8px;max-width:880px"><button class="btn" type="button">关闭</button><button class="btn btn-primary" type="button">保存</button></div>
